name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      release:
        description: 'Create a release with APKs'
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build release APK
        if: inputs.release
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: asksinanalyzer-debug
          path: app/build/outputs/apk/debug/asksinanalyzer-debug.apk
          retention-days: 30

      - name: Upload release APK
        if: inputs.release
        uses: actions/upload-artifact@v4
        with:
          name: asksinanalyzer-release
          path: app/build/outputs/apk/release/asksinanalyzer-release.apk
          retention-days: 30

  release:
    if: inputs.release
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Get version name
        id: version
        run: |
          VERSION=$(./gradlew -q printVersionName 2>/dev/null || echo "1.0.0")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION-$(date +'%Y%m%d%H%M')" >> $GITHUB_OUTPUT

      - name: Create GitHub Release and upload APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "AskSin Analyzer ${{ steps.version.outputs.tag }}"
          body: |
            ## AskSin Analyzer – Android APK

            Native Android app for analysing HomeMatic BidCoS radio telegrams
            via CC1101 + ATMega328P sniffer over USB OTG.

            ### Install
            1. Download `asksinanalyzer-release.apk` (or `asksinanalyzer-debug.apk`) below
            2. On your Android device: *Settings → Security → Install unknown apps* → allow your browser/file manager
            3. Open the APK file to install

            ### Built from commit
            ${{ github.sha }}
          files: |
            app/build/outputs/apk/debug/asksinanalyzer-debug.apk
            app/build/outputs/apk/release/asksinanalyzer-release.apk
          draft: false
          prerelease: false
